[pytest]
# Plain `pytest` runs only the offline self-tests. Live runs are explicit:
#   pytest test_sources.py   (read each source, save snapshots)
#   pytest test_main.py      (send the prompts to NCP and grade them)
testpaths = selftest
addopts = -p no:randomly -ra --tb=short --html=reports/report.html --self-contained-html
markers =
    probe: reads each ground-truth source and saves a snapshot (no NCP chat)
    offline: self-tests with fake data, no network
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
